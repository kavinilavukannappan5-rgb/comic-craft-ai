<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - Comic Story Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background: #fffbeb url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            border: 4px solid #111827;
            box-shadow: 10px 10px 0px #111827;
            border-radius: 12px;
            padding: 36px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'Bangers', cursive;
            font-size: 48px;
            color: #dc2626;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000;
        }
        .subtitle {
            font-size: 16px;
            color: #4b5563;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: #1f2937;
            font-size: 16px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 3px solid #111827;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            background: #fefce8;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            background: #ffffff;
            border-color: #2563eb;
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .col {
            flex: 1;
        }
        .btn-submit {
            width: 100%;
            background: #facc15;
            color: #000;
            border: 4px solid #111827;
            box-shadow: 4px 4px 0px #111827;
            padding: 14px;
            font-family: 'Bangers', cursive;
            font-size: 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 12px;
            letter-spacing: 1px;
        }
        .btn-submit:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #111827;
            background: #fde047;
        }
        .btn-submit:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #111827;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ ComicCraft ⚡</h1>
            <p class="subtitle">AI-Powered Comic Story & Illustration Creator</p>
        </div>

        <form action="/generate" method="POST">
            <div class="form-group">
                <label for="story_prompt">📖 Story Prompt</label>
                <textarea id="story_prompt" name="story_prompt" rows="3" placeholder="e.g. A brave fox exploring an enchanted forest in search of the glowing Sun Stone." required>A brave fox exploring an enchanted forest in search of the glowing Sun Stone.</textarea>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="character_name">🦊 Main Character</label>
                    <input type="text" id="character_name" name="character_name" value="Reynard" placeholder="Character Name" required>
                </div>
                <div class="col form-group">
                    <label for="setting">🌲 Setting</label>
                    <select id="setting" name="setting">
                        <option value="Enchanted Forest" selected>Enchanted Forest</option>
                        <option value="Cyberpunk Metropolis">Cyberpunk Metropolis</option>
                        <option value="Ancient Ruins">Ancient Ruins</option>
                        <option value="Deep Space Station">Deep Space Station</option>
                        <option value="Superhero City">Superhero City</option>
                        <option value="Vintage Parisian Bakery">Vintage Parisian Bakery</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="story_tone">🎭 Tone</label>
                    <select id="story_tone" name="story_tone">
                        <option value="Dramatic" selected>Dramatic</option>
                        <option value="Funny">Funny & Light-hearted</option>
                        <option value="Poetic">Poetic & Mysterious</option>
                        <option value="Action-Packed">Action-Packed</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="art_style">🎨 Art Style</label>
                    <select id="art_style" name="art_style">
                        <option value="Anime" selected>Anime / Manga</option>
                        <option value="Comic Book">Classic Comic Book</option>
                        <option value="Pixel Art">Pixel Art</option>
                        <option value="Dark Graphic Novel">Dark Graphic Novel</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">🚀 GENERATE COMIC STRIP</button>
        </form>
    </div>
</body>
</html>
